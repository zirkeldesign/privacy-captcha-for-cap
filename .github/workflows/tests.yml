name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: composer format:test

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer phpstan

  javascript:
    name: JavaScript assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify vendored cap-widget + WASM are up to date
        run: bun run build:check

      - name: Test the programmatic and Fluent Forms scripts
        run: bun run test:js

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  fluent-forms:
    name: Fluent Forms integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAP_WP_VERSION: '7.1.4'
      CAP_FLUENT_ONLY: '1'
      FLUENT_FORMS_VERSION: '6.2.17'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runner context is not available in a job-level env block.
      # Support running this test locally using act (https://github.com/nektos/act):
      # When the workflow runs under nektos/act, the workflow runs inside act's
      # docker container as root, so we need to allow WP-CLI to run as root.
      # This ensures that WP-CLI commands can be executed without permission issues.
      - name: Point the fixture at the runner's temp directory
        run: |
          echo "CAP_WP_ROOT=$RUNNER_TEMP/cap-fluent-wordpress" >> "$GITHUB_ENV"
          if [[ "${ACT:-}" == "true" && "$(id -u)" -eq 0 ]]; then
            echo "WP_CLI_ALLOW_ROOT=1" >> "$GITHUB_ENV"
          fi

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          tools: wp-cli
          ini-values: memory_limit=512M
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Provision WordPress
        run: composer test:integration:setup

      - name: Install Fluent Forms
        run: |
          wp plugin install fluentform --version="$FLUENT_FORMS_VERSION" --activate --path="$CAP_WP_ROOT"
          wp option patch insert cap_captcha_settings integrations fluent_forms true --format=json --path="$CAP_WP_ROOT"

      - name: Test real Fluent Forms submissions
        run: composer test:integration -- tests/Integration/FluentFormsFlowTest.php --fail-on-skipped

